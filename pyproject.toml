[project]
name = "instrumenthub"
version = "0.1.0"
description = "Platform for acquisition, processing, storage and analysis of instrumentation data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "numpy",
    "pandas",
    "pydantic-settings",
    "pyserial>=3.5",
    "pyarrow",
    "scipy",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "mypy",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "types-pyserial>=3.5.0.20260712",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
asyncio_mode = "auto"
