name: instrumenthub

services:
  database:
    image: timescale/timescaledb:2.30.2-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-instrumenthub}
      POSTGRES_USER: ${POSTGRES_USER:-instrumenthub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-instrumenthub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - instrumenthub-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      APP_NAME: InstrumentHub
      APP_VERSION: 0.1.0
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      API_V1_PREFIX: /api/v1
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-instrumenthub}:${POSTGRES_PASSWORD:-instrumenthub}@database:5432/${POSTGRES_DB:-instrumenthub}
      DATABASE_ECHO: ${DATABASE_ECHO:-false}
      WEBSOCKET_MAX_CONNECTIONS: ${WEBSOCKET_MAX_CONNECTIONS:-100}
    ports:
      - "${API_PORT:-8200}:8000"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Optional local SMTP sink for testing email notifications. Start with:
  # docker compose --profile mail up -d mailpit
  # Set SMTP_HOST=mailpit, SMTP_PORT=1025, SMTP_STARTTLS=false in .env.
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail"]
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  instrumenthub-db-data:
